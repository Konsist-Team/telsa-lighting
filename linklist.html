Webflow.push(function() {
$('.menu-button').click(function(e) {
  var clicks = $(this).data('clicks');
  if (clicks) {
e.preventDefault();
$('body').css('overflow', 'auto');
  } else {
e.preventDefault();
$('body').css('overflow', 'hidden');
  }
  $(this).data("clicks", !clicks);
});
});
</script>
  <script>
	makeWebflowFormAjax = function( forms, successCallback, errorCallback ) {
      forms.each(function(){
        var form = $(this);
        form.on("submit", function(){
          var container =   form.parent();
          var doneBlock  =  $(".w-form-done", container);
          var failBlock  =  $(".w-form-fail", container);
          var action =    form.attr("action");
          var method =    form.attr("method");
          var data =      form.serialize() + '&form=' + form.data('form');
          if (form.data('form') == 'subscription') {
          	method = 'post';
            data = new FormData(this);
            data.append('client', 'tl');
          }
          // call via ajax
          $.ajax({
            type: method,
            url: action,
            data: data,
            processData: false,
            contentType: false,
            success: function (resultData) {
              if (typeof successCallback === 'function') {
                // call custom callback
                result = successCallback(resultData, container);
                if ( ! result ) {
                  // show error (fail) block
                  form.show();
                  doneBlock.hide();
                  failBlock.show();
                  return;
                }
              }
              // show success (done) block
              form.hide();
              doneBlock.show();
              failBlock.hide();
            },
            error: function (e) {
              // call custom callback
              if (typeof errorCallback === 'function') {
                errorCallback(e)
              }
              // show error (fail) block
              form.show();
              doneBlock.hide();
              failBlock.show();
            }
          });
          // prevent default webdlow action
          return false;
        });
      });
    }
    makeWebflowFormAjax($("form[data-form='subscription']"), function(data, parent) {
      var resultObj = $.parseJSON(data);
      if(resultObj.success) {
        //$form[0].reset();
        parent.find('.w-form-done > div').text('Got it! Keep an eye out for our emails.');
        localStorage.subscribed ='true';
        return true;
      }
      else {
        parent.find('.w-form-fail > div').text(resultObj.message);
        return false;
      }
    });
</script>
